  <script>
    let timeLeft = 15;
    let isReady = false;
    const timerElem = document.getElementById("timer");
    const btnTimerElem = document.getElementById("btn-timer");
    const downloadBtn = document.getElementById("download-btn");

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerElem.innerText = timeLeft;
        btnTimerElem.innerText = timeLeft;
      } else {
        clearInterval(countdown);
        isReady = true;
        timerElem.innerText = "🚀 Ready for Direct Download!";
        downloadBtn.classList.remove("disabled");
        downloadBtn.innerHTML = "⚡ SUPER FAST DOWNLOAD ⚡";
